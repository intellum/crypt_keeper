name: Tests

on: [push, pull_request]

jobs:
  test:
    name: Test on Ruby ${{ matrix.ruby-version }} / Active Record ${{ matrix.rails }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.3.14', '3.4.13']
        rails: ['7_0']

    env:
      TESTING_RAILS_VERSION: ${{ matrix.rails }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/activerecord_${{ matrix.rails }}.gemfile

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: crypt_keeper
          POSTGRES_PASSWORD: crypt_keeper
          POSTGRES_DB: crypt_keeper_providers
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5   
        ports:
          - 5432
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: crypt_keeper_providers
          MYSQL_USER: crypt_keeper
          MYSQL_PASSWORD: crypt_keeper
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3      
    
    steps:
      - uses: actions/checkout@v2
    
      - name: Setup System
        run: sudo apt-get install libsqlite3-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
                  
      - name: Copy database config
        run: |
          sed -e "s/POSTGRES_PORT/${{ job.services.postgres.ports[5432] }}/" \
              -e "s/MYSQL_PORT/${{ job.services.mysql.ports[3306] }}/" \
              spec/github_actions.database.yml > spec/database.yml

      - name: Enable pgcrypto extension
        run: |
          PGPASSWORD=crypt_keeper psql crypt_keeper_providers -p ${{ job.services.postgres.ports[5432] }} -h localhost -p 5432 -U crypt_keeper -tc "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
    
      - name: Run tests
        run: bundle exec rake
